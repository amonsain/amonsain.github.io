name: Update F-GUID page

on:
  schedule:
    - cron: "40 * * * *"         # toutes les heures, à H+40
  push:
    branches: [ "main" ]
    paths: [ "fguid/run-request.txt" ]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python3 fguid/update_fguid.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fguid/index.html fguid/data_base.json fguid/elev_cache.json 2>/dev/null || git add fguid/index.html fguid/data_base.json
          git diff --staged --quiet && echo "rien de neuf" && exit 0
          git commit -m "fguid: mise à jour auto des données ADS-B"
          git pull --rebase origin main
          git push
